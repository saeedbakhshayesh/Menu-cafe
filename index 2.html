<style>
/* VARIABLES */
:root{
  --cream:#f6e9d8; --dim:rgba(246,233,216,.74); --faint:rgba(246,233,216,.5);
  --c1:#f0c48a; --c2:#c4824a; --ink:#24170f;
  --display:"Fraunces",Georgia,serif; --body:"Jost",system-ui,sans-serif;
  --r-md:22px; --pill:999px;
  --ease:cubic-bezier(.22,.8,.24,1); --t:.45s var(--ease);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html[lang=fa]{--display:"Lalezar","Vazirmatn",sans-serif;--body:"Vazirmatn",system-ui,sans-serif}
/* GLOBAL STYLES */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-weight:300;color:var(--cream);line-height:1.6;overflow-x:hidden;
  background:linear-gradient(180deg,#8a6850 0,#74543f 10%,#5a402f 26%,#3d2b20 48%,#25180f 72%,#120b08 100%)}
/* animated background (GPU-only: transforms) */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:.42;will-change:transform;
  background:radial-gradient(closest-side,var(--b),transparent 72%);animation:drift var(--d) ease-in-out infinite alternate}
.bg i:nth-child(1){--b:#f6e8d2;top:-30vmax;inset-inline-start:-30vmax;--d:26s}
.bg i:nth-child(2){--b:#c9a07a;top:15vh;inset-inline-end:-45vmax;--d:32s;animation-delay:-9s}
.bg i:nth-child(3){--b:#dfa890;bottom:-35vmax;inset-inline-start:-35vmax;--d:38s;animation-delay:-14s;opacity:.34}
.bg i:nth-child(4){--b:#e3b66f;bottom:-40vmax;inset-inline-end:-30vmax;--d:30s;animation-delay:-5s;opacity:.3}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02}
html[lang=fa] *{letter-spacing:0!important}
html[lang=fa] h1,html[lang=fa] h2,html[lang=fa] h3{font-weight:400;line-height:1.3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
html[dir=rtl] .flip{transform:scaleX(-1)}

/* LIQUID GLASS (clear + glossy) */
.lg{position:relative;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,0) 45%,rgba(255,255,255,.05));text-shadow:0 1px 4px rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(.4px) saturate(1.7) brightness(1.06);-webkit-backdrop-filter:blur(.4px) saturate(1.7) brightness(1.06);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 8px rgba(255,255,255,.18),inset 0 0 20px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.35)}
.lg::before{content:"";position:absolute;z-index:-1;inset:2px 9% auto;height:44%;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.5}
.lg::after{content:"";position:absolute;z-index:-1;inset:auto 14% 1px;height:30%;border-radius:inherit;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.38),transparent 70%)}
.lg-soft{backdrop-filter:blur(2px) saturate(1.7) brightness(1.04);-webkit-backdrop-filter:blur(2px) saturate(1.7) brightness(1.04)}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .3s var(--ease)}
.ib:active{transform:scale(.9)}
.ib svg{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.langBtn{font-size:.82rem;font-weight:500}

/* HEADER (hero) */
.hero{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 26px) 24px 28px;overflow:hidden;max-width:640px;margin:0 auto}

.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,15,10,.55),rgba(24,15,10,.05) 38%,rgba(24,15,10,0) 62%,rgba(24,15,10,.55)),linear-gradient(90deg,rgba(24,15,10,.4),transparent 70%)}
.hero .langBtn{position:absolute;top:calc(var(--safe-t) + 16px);inset-inline-end:18px;z-index:2}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.brand svg{width:38px;height:auto;color:var(--cream);filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.brand b{font-weight:400;letter-spacing:.38em;font-size:.9rem;padding-inline-start:.38em}
.brand small{letter-spacing:.5em;font-size:.62rem;color:var(--dim);padding-inline-start:.5em}
.hl{margin-top:26px;font-size:clamp(3rem,15.5vw,5rem);filter:drop-shadow(0 6px 22px rgba(0,0,0,.45))}
.hl span{display:block;width:fit-content;margin-right:auto;padding-block:.02em;opacity:0;animation:rise 1.1s var(--ease) forwards;animation-delay:calc(.25s + var(--i)*.13s);
  background:linear-gradient(95deg,#fff7ea,#f6d6a8 55%,#e0a066);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl span:nth-child(even){background-image:linear-gradient(95deg,#f8e3c4,#e9b07a 50%,#c97b57)}
html[lang=fa] .hl{line-height:1.1;font-size:clamp(2.8rem,14vw,4.6rem)}
.hero-cta{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:30px;opacity:0;animation:rise 1s var(--ease) .9s forwards}
.btn-wide{flex:1;height:56px;border-radius:var(--pill);text-align:start;padding:0 26px;font-size:1rem;font-weight:400;letter-spacing:.04em;transition:transform .3s var(--ease)}
.btn-wide:active{transform:scale(.97)}
.btn-round{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;transition:transform .35s var(--ease)}
.btn-round:hover{transform:translateX(4px) scale(1.04)}
html[dir=rtl] .btn-round:hover{transform:translateX(-4px) scale(1.04)}
.btn-round svg{width:24px;height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.hero-note{margin-top:16px;color:var(--dim);font-size:.9rem;opacity:0;animation:rise 1s var(--ease) 1.05s forwards}

/* NAVIGATION */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 8px) 18px 8px;transform:translateY(-110%);visibility:hidden;
  transition:transform var(--t),visibility 0s .45s;
  background:linear-gradient(180deg,rgba(26,16,11,.94),rgba(26,16,11,.78));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1)}
.topbar.on{transform:none;visibility:visible;transition-delay:0s}
.topbar-in{max-width:640px;margin:0 auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini{display:flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.3em}
.mini svg{width:20px}
.tools{display:flex;gap:8px}
.tools .ib{width:42px;height:42px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:var(--pill);font-size:.9rem;color:var(--dim);border:1px solid rgba(255,255,255,.12);transition:background .3s,color .3s,transform .3s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-current="true"]{background:linear-gradient(120deg,var(--c1),var(--c2));color:var(--ink);font-weight:500;border-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.searchbox{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t)}
.searchbox.open{grid-template-rows:1fr}
.searchbox>div{overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.searchbox.open>div{visibility:visible;transition-delay:0s}
.searchbox input{width:100%;height:46px;margin-top:8px;padding:0 20px;border-radius:var(--pill);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:1rem}
.searchbox input::placeholder{color:var(--faint)}
.dock{position:fixed;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translate(-50%,170%);visibility:hidden;z-index:30;display:flex;gap:4px;padding:6px;border-radius:var(--pill);width:min(92vw,360px);transition:transform var(--t),visibility 0s .45s}
.dock.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.dock button{flex:1;height:54px;border-radius:var(--pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.68rem;color:var(--dim);transition:background .3s,color .3s,transform .3s var(--ease)}
.dock button:active{transform:scale(.92)}
.dock button[aria-current="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.08));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.85),inset 0 -2px 6px rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.25)}
.dock svg{width:21px;height:21px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}

/* MENU */
main{padding-bottom:150px}
#menu{scroll-margin-top:calc(var(--bar-h,108px) - 30px)}
.menu-head{padding:48px 0 6px}
.menu-head h2{font-size:clamp(4.2rem,22vw,6.4rem);background:linear-gradient(100deg,#fff4e2,#f0c48a 50%,#d98a8f);-webkit-background-clip:text;background-clip:text;color:transparent;padding-block:.04em}
.menu-head p{color:var(--dim);margin-top:4px}
.cat{scroll-margin-top:calc(var(--bar-h,108px) + 14px);padding-top:34px}
.cat h3{font-size:clamp(2.5rem,11vw,3.4rem);width:fit-content;max-width:100%;padding-block:.06em;background:linear-gradient(100deg,var(--cream),var(--c1) 55%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cat>p{color:var(--dim);font-size:.92rem;margin:2px 0 16px}
.list{display:grid;gap:10px}

/* COMPONENTS */
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:16px 20px;border-radius:var(--r-md);
  background:linear-gradient(135deg,rgba(255,236,214,.13),rgba(32,19,12,.42));border:1px solid rgba(255,236,214,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 18px rgba(0,0,0,.14);transition:transform .4s var(--ease),border-color .4s}
.item::before{content:"";position:absolute;inset-block:18px;inset-inline-start:0;width:3px;border-radius:3px;background:linear-gradient(var(--c1),var(--c2))}
.item:hover{transform:translateY(-2px);border-color:var(--c1)}
.item h4{font-family:var(--body);font-weight:500;font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;line-height:1.5}
.alt{grid-column:1;font-size:.78rem;color:var(--faint)}
.desc{grid-column:1;font-size:.88rem;color:var(--dim);margin-top:2px}
.price{grid-row:1/span 3;align-self:center;text-align:end;font-family:var(--display);font-size:1.6rem;line-height:1.2;white-space:nowrap;background:linear-gradient(120deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .price{font-weight:800}
.price small{display:block;font-family:var(--body);font-size:.66rem;-webkit-text-fill-color:var(--faint)}
.badge{font-size:.68rem;padding:1px 10px;border-radius:var(--pill);background:linear-gradient(120deg,var(--c1),var(--c2));color:var(--ink);font-weight:500}
.empty{padding:48px 0;text-align:center;color:var(--dim)}
.foot{margin-top:40px;padding:16px 18px;border-radius:var(--r-md);font-size:.82rem;color:var(--dim);background:rgba(0,0,0,.2);border:1px dashed rgba(255,255,255,.22)}

/* ANIMATIONS */
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22vw,16vh,0) scale(1.18)}100%{transform:translate3d(-14vw,28vh,0) scale(.92)}}
@keyframes zoom{from{transform:scale(1.1)}to{transform:none}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.item.rv.in{transition:transform .4s var(--ease),border-color .4s,opacity .7s}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .hl span,.hero-cta,.hero-note,.rv{opacity:1;transform:none}
}

/* RESPONSIVE */
@media (min-width:700px){
  .hero{min-height:90vh;margin-top:2vh;border-radius:36px}
  .dock{bottom:20px}
}
@media (hover:none){.item:hover{transform:none;border-color:rgba(255,236,214,.15)}.btn-round:hover{transform:none}}
@media (max-width:360px){.item{padding:14px}.price{font-size:1.35rem}}
</style>
</head>

<script>
/* JAVASCRIPT */
/* ---- EDIT ME: texts per language ---- */
const UI = {
  en: { dir:"ltr", title:"Your Café · Menu", brand:"YOUR CAFÉ", alt:"کافه‌ی شما", toggle:"فا", langLabel:"Language", res:"results",
    hl:["Good","Taste,","Good","Moments."], explore:"Explore menu", sub:"Slow mornings and good company.",
    menu:"Menu", menuSub:"Sample menu — replace with your own.", home:"Home", search:"Search", top:"Top",
    ph:"Search drinks and dishes", none:"No matches found. Try another word.", cats:"Menu categories", quick:"Quick navigation",
    foot:"Placeholder content: café name, logo and every menu item are samples. Edit UI, CAFE and menuData in this file.",
    pop:"Popular", new:"New", rec:"Recommended" },
  fa: { dir:"rtl", title:"کافه شما · منو", brand:"کافه‌ی شما", alt:"YOUR CAFÉ", toggle:"EN", langLabel:"زبان", res:"مورد",
    hl:["طعمِ","خوب،","لحظه‌های","خوب."], explore:"مشاهده منو", sub:"صبح‌های آرام و همنشینی خوب.",
    menu:"منو", menuSub:"منوی نمونه — با منوی خودتان جایگزین کنید.", home:"خانه", search:"جستجو", top:"بالا",
    ph:"جستجوی نوشیدنی و غذا", none:"موردی پیدا نشد. کلمه دیگری امتحان کنید.", cats:"دسته‌بندی منو", quick:"دسترسی سریع",
    foot:"محتوای نمونه: نام کافه، لوگو و همه آیتم‌های منو آزمایشی هستند. بخش‌های UI، CAFE و menuData را در همین فایل ویرایش کنید.",
    pop:"محبوب", new:"جدید", rec:"پیشنهادی" }
};
/* Prices are numbers (sample). unit is shown next to the number. */
const CAFE = { unit:{ en:"k", fa:"هزار تومان" }, defaultLang:"fa" };

/* ---- EDIT ME: menu data (ALL SAMPLES) ----
   I(nameEN, nameFA, descEN, descFA, price, badge?)  badge: "pop" | "new" | "rec" */
const I = (n0,n1,d0,d1,p,b) => ({ n:[n0,n1], d:[d0,d1], p, b });
const menuData = [
 { id:"coffee", t:["Coffee","قهوه"], note:["Bold flavors, timeless classics.","طعم‌های قوی و کلاسیک‌های ماندگار."], c:["#f6cf93","#c4824a"], items:[
  I("Espresso","اسپرسو","Bold and smooth.","قوی و روان.",60),
  I("Americano","آمریکانو","Pure and simple.","ساده و خالص.",70),
  I("Latte","لاته","Espresso with steamed milk.","اسپرسو با شیر بخارداده.",90,"pop"),
  I("Cappuccino","کاپوچینو","Rich, creamy, classic.","غنی، کرمی و کلاسیک.",90),
  I("Mocha","موکا","Chocolate meets coffee.","شکلات و قهوه در یک لیوان.",100),
  I("Flat White","فلت وایت","Velvety microfoam over a double shot.","فوم مخملی روی دبل اسپرسو.",95)]},
 { id:"cold", t:["Cold Drinks","نوشیدنی سرد"], note:["Chilled. Fresh. Refreshing.","خنک، تازه و دل‌انگیز."], c:["#d6e8c8","#7ea08a"], items:[
  I("Iced Latte","لاته سرد","Chilled espresso, cold milk.","اسپرسوی سرد با شیر یخ.",95),
  I("Iced Americano","آمریکانو سرد","Pure coffee, ice cold.","قهوه خالص با یخ.",75),
  I("Matcha Latte","ماچا لاته","Earthy, creamy, refreshing.","خاکی، کرمی و خنک.",110,"new"),
  I("Cold Brew","کلدبرو","Steeped 18 hours, smooth and low acid.","۱۸ ساعت دم‌آوری، نرم و کم‌اسید.",100),
  I("Fresh Lemonade","لیموناد تازه","Light, citrusy, fresh.","سبک، ترش و تازه.",70)]},
 { id:"hot", t:["Tea & Hot Drinks","چای و نوشیدنی گرم"], note:["Warm cups for slow moments.","فنجان‌های گرم برای لحظه‌های آرام."], c:["#f5cfa6","#e08e6d"], items:[
  I("Black Tea","چای سیاه","Strong loose-leaf tea.","چای برگی پررنگ.",45),
  I("Green Tea","چای سبز","Light and clean.","سبک و پاک.",50),
  I("Hot Chocolate","هات چاکلت","Thick, rich, with whipped cream.","غلیظ و غنی با خامه.",85),
  I("Chai Latte","چای ماسالا لاته","Spiced tea with steamed milk.","چای ادویه‌دار با شیر.",90),
  I("Herbal Infusion","دمنوش گیاهی","Ask for today's blend.","طعم امروز را از ما بپرسید.",55)]},
 { id:"mock", t:["Smoothies & Mocktails","اسموتی و موکتل"], note:["Fruity, bright, made to order.","میوه‌ای، شاداب و تازه‌ساز."], c:["#f7bcc0","#c76d86"], items:[
  I("Berry Smoothie","اسموتی توت‌ها","Mixed berries, yogurt, honey.","مخلوط توت‌ها، ماست و عسل.",105),
  I("Mango Passion","انبه و پشن‌فروت","Tropical, sweet and tangy.","گرمسیری، شیرین و ترش.",105,"new"),
  I("Virgin Mojito","موهیتو","Mint, lime, soda.","نعنا، لیمو و سودا.",90,"pop"),
  I("Peach Iced Tea","آیس‌تی هلو","Black tea, peach, ice.","چای سیاه، هلو و یخ.",80)]},
 { id:"breakfast", t:["Breakfast","صبحانه"], note:["Served until noon.","تا ظهر سرو می‌شود."], c:["#f9e0a0","#d8a93f"], items:[
  I("Avocado Toast","آووکادو تست","Sourdough, avocado, chili, lemon.","نان خمیرترش، آووکادو، فلفل و لیمو.",150,"rec"),
  I("Shakshuka","شکشوکا","Eggs in spiced tomato sauce, bread.","تخم‌مرغ در سس گوجه ادویه‌دار با نان.",140),
  I("Pancakes","پنکیک","Maple syrup, butter, berries.","شربت افرا، کره و توت.",130),
  I("Croissant Plate","کروسان","Butter croissant, jam, cheese.","کروسان کره‌ای با مربا و پنیر.",110)]},
 { id:"pasta", t:["Pasta","پاستا"], note:["Freshly tossed to order.","تازه و سفارشی."], c:["#f5ac90","#c2553f"], items:[
  I("Creamy Mushroom","پاستا قارچ و خامه","Mushrooms, parmesan cream, herbs.","قارچ، سس خامه پارمزان و سبزی معطر.",190,"pop"),
  I("Pesto Chicken","پاستا پستو مرغ","Basil pesto, grilled chicken.","پستو ریحان و مرغ گریل‌شده.",200),
  I("Arrabbiata","پاستا آرابیاتا","Spicy tomato, garlic, basil.","گوجه تند، سیر و ریحان.",170)]},
 { id:"snacks", t:["Snacks","اسنک"], note:["Something small, something good.","یک لقمه کوچک و خوشمزه."], c:["#ebcfae","#a8794f"], items:[
  I("Loaded Fries","سیب‌زمینی ویژه","Cheese sauce, herbs, crispy fries.","سس پنیر، سبزی معطر و سیب‌زمینی ترد.",120),
  I("Club Sandwich","کلاب ساندویچ","Chicken, egg, tomato, greens.","مرغ، تخم‌مرغ، گوجه و کاهو.",180),
  I("Chicken Wrap","رپ مرغ","Grilled chicken, veggies, garlic sauce.","مرغ گریل، سبزیجات و سس سیر.",160),
  I("Cheese Toastie","تست پنیر","Melted cheddar on toasted bread.","چدار ذوب‌شده روی نان تست.",100)]},
 { id:"desserts", t:["Desserts","دسر"], note:["Sweet moments.","لحظه‌های شیرین."], c:["#ecc6dc","#a56a8c"], items:[
  I("Tiramisu","تیرامیسو","Mascarpone, espresso-soaked sponge, cocoa.","ماسکارپونه، کیک آغشته به اسپرسو و کاکائو.",130,"rec"),
  I("Basque Cheesecake","چیزکیک باسک","Burnt top, creamy centre.","رویه سوخته و مرکز کرمی.",140),
  I("Chocolate Brownie","براونی شکلاتی","Warm, fudgy, with sea salt.","گرم و نرم با نمک دریا.",110),
  I("Affogato","آفوگاتو","Vanilla gelato under hot espresso.","بستنی وانیلی با اسپرسوی داغ.",100)]}
];

/* ---- App ---- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* normalise Persian/Arabic variants so "امریکانو" finds "آمریکانو" and "ي/ی", "ك/ک" match */
const norm = s => String(s).toLowerCase().replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[آأإ]/g,"ا").replace(/[ةۀ]/g,"ه")
  .replace(/[\u200c\u064b-\u0652\u0640]/g," ").replace(/[^\p{L}\p{N}]+/gu," ").trim();
menuData.forEach(c => c.items.forEach(it => it.s = norm([...it.n, ...it.d, ...c.t].join(" "))));  // search index, built once

let L = CAFE.defaultLang, cur = menuData[0].id, lock = 0, spy, view = [];
try { const s = localStorage.getItem("lang"); if (UI[s]) L = s; } catch (e) {}
const idx = () => L === "fa" ? 1 : 0;
const nf = () => new Intl.NumberFormat(L === "fa" ? "fa-IR" : "en-US");

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));

/* menu is rendered once per language; searching only toggles [hidden] (no re-render, no flicker) */
function render(instant) {
  const i = idx(), u = UI[L], f = nf();
  $("#sections").innerHTML = menuData.map(cat => `<section class="cat" id="${cat.id}" aria-labelledby="h-${cat.id}" style="--c1:${cat.c[0]};--c2:${cat.c[1]}">
      <h3 id="h-${cat.id}" class="rv">${esc(cat.t[i])}</h3><p class="rv">${esc(cat.note[i])}</p>
      <div class="list">${cat.items.map(it => `<article class="item rv">
        <h4>${esc(it.n[i])}${it.b ? `<span class="badge">${esc(u[it.b])}</span>` : ""}</h4>
        <span class="price">${typeof it.p === "number" ? f.format(it.p) : esc(it.p)}<small>${esc(CAFE.unit[L])}</small></span>
        <span class="alt" lang="${i ? "en" : "fa"}">${esc(it.n[1 - i])}</span>
        <p class="desc">${esc(it.d[i])}</p></article>`).join("")}</div></section>`).join("");
  view = [...document.querySelectorAll(".cat")].map((sec, k) => ({ sec, els: [...sec.querySelectorAll(".item")], s: menuData[k].items.map(it => it.s) }));
  $("#sections").querySelectorAll(".rv").forEach(el => instant ? el.classList.add("in") : io.observe(el));
  watch(); filter();
}

function filter() {
  const toks = norm($("#q").value).split(" ").filter(Boolean); let n = 0;
  view.forEach(g => {
    let any = false;
    g.els.forEach((el, k) => { const ok = toks.every(t => g.s[k].includes(t)); el.hidden = !ok; if (ok) { any = true; n++; if (toks.length) el.classList.add("in"); } });
    g.sec.hidden = !any;
    if (any && toks.length) g.sec.querySelectorAll(".rv").forEach(x => x.classList.add("in"));
  });
  $("#empty").hidden = n > 0;
  $("#status").textContent = toks.length ? nf().format(n) + " " + UI[L].res : "";
}

function setLang(l, first) {
  L = l; try { localStorage.setItem("lang", l); } catch (e) {}
  const u = UI[l], h = document.documentElement;
  h.lang = l; h.dir = u.dir; document.title = u.title;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = u[e.dataset.t]);
  document.querySelectorAll("[data-al]").forEach(e => e.setAttribute("aria-label", u[e.dataset.al] || u.explore));
  document.querySelectorAll("[data-lang]").forEach(e => e.textContent = u.toggle);
  $("#q").placeholder = u.ph;
  $("#brandName").textContent = u.brand; $("#brandAlt").textContent = u.alt; $("#miniName").textContent = u.brand;
  $("#hl").innerHTML = u.hl.map((w, n) => `<span style="--i:${n}">${esc(w)}</span>`).join("");
  $("#chips").innerHTML = menuData.map(c => `<button class="chip" data-cat="${c.id}" style="--c1:${c.c[0]};--c2:${c.c[1]}">${esc(c.t[idx()])}</button>`).join("");
  mark(cur, false);
  render(!first);
  onScroll();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(L === "fa" ? "en" : "fa")));

/* category chips + scroll spy */
function mark(id, scroll) {
  document.querySelectorAll(".chip").forEach(c => {
    const on = c.dataset.cat === id; c.setAttribute("aria-current", on);
    if (on && scroll) {
      const box = $("#chips").getBoundingClientRect(), r = c.getBoundingClientRect();
      $("#chips").scrollBy({ left: (r.left + r.width / 2) - (box.left + box.width / 2), behavior: "smooth" });
    }
  });
}
const activate = id => { cur = id; mark(id, true); };
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  clearSearch(); lock = Date.now() + 900; activate(b.dataset.cat);
  document.getElementById(b.dataset.cat)?.scrollIntoView({ behavior: "smooth" });
});
function watch() {
  spy?.disconnect();
  spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && Date.now() > lock) activate(e.target.id); }), { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll(".cat").forEach(s => spy.observe(s));
}

/* bars + dock state */
const topbar = $("#topbar"), dock = $("#dock"); let tick = false;
function onScroll() {
  tick = false;
  const past = scrollY > innerHeight * .55;
  topbar.classList.toggle("on", past);
  dock.classList.toggle("on", past || scrollY > 40);
  dock.querySelector('[data-act="home"]').setAttribute("aria-current", !past);
  dock.querySelector('[data-act="menu"]').setAttribute("aria-current", past);
}
addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(onScroll); } }, { passive: true });
/* keep scroll offsets in sync with the real (variable-height) top bar */
const syncBar = () => document.documentElement.style.setProperty("--bar-h", topbar.offsetHeight + "px");
if ("ResizeObserver" in window) new ResizeObserver(syncBar).observe(topbar);
syncBar();

/* search: tokenised (all words must match), debounced, filters in place */
const goMenu = () => $("#menu").scrollIntoView({ behavior: "smooth" });
function clearSearch() { if ($("#q").value) { $("#q").value = ""; filter(); } }
function toggleSearch(force) {
  const box = $("#searchbox"), open = force ?? !box.classList.contains("open");
  box.classList.toggle("open", open);
  $("#searchBtn").setAttribute("aria-expanded", open);
  if (open) { if (scrollY < innerHeight * .55) goMenu(); setTimeout(() => $("#q").focus({ preventScroll: true }), 300); }
  else { clearSearch(); $("#q").blur(); }
}
let tm;
$("#q").addEventListener("input", () => {
  clearTimeout(tm);
  tm = setTimeout(() => { filter(); if ($("#q").value && scrollY < $("#menu").offsetTop - 60) goMenu(); }, 100);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
$("#searchBtn").addEventListener("click", () => toggleSearch());
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#searchbox").classList.contains("open")) toggleSearch(false); });

/* buttons */
document.querySelectorAll("[data-go=menu]").forEach(b => b.addEventListener("click", goMenu));
dock.addEventListener("click", e => {
  const a = e.target.closest("button")?.dataset.act;
  if (a === "home" || a === "top") scrollTo({ top: 0, behavior: "smooth" });
  if (a === "menu") goMenu();
  if (a === "search") toggleSearch(true);
});

setLang(L, true);
</script>
